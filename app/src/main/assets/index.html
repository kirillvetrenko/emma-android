<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfcf9"><meta name="description" content="Английский без спешки: объяснение каждой темы и две практики. 84 темы A1–B1, аудирование и голосовые ответы."><title>Emma — английский без спешки</title><style>:root{--green:#58b900;--deep:#3f8e00;--soft:#f0f8e9;--text:#263025;--muted:#7d857b;--line:#e8ece5;--bg:#fbfcf9;--blue:#2199d1;--red:#b64d4d;color-scheme:light;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.6}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #89c8e2;outline-offset:4px}button:disabled{opacity:.5;cursor:default}a{color:var(--blue);overflow-wrap:anywhere}header{max-width:980px;margin:auto;padding:25px 28px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:30px;color:var(--green);letter-spacing:-1.5px}.brand span{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1.5px;margin-left:10px;text-transform:uppercase}.xp{font-size:14px;font-weight:800;color:#a98428;background:#fff7df;padding:6px 14px;border-radius:20px}.layout{display:grid;grid-template-columns:175px minmax(0,1fr);gap:35px;max-width:980px;margin:20px auto;padding:0 28px 60px}nav{display:flex;flex-direction:column;gap:8px;position:sticky;top:24px;align-self:start}nav button{border:1px solid transparent;background:transparent;padding:13px 15px;border-radius:12px;color:var(--muted);font-size:14px;font-weight:750;text-align:left}nav button.active{color:var(--deep);background:var(--soft);border-color:#dfec les{display:flex;gap:8px;flex-wrap:wrap;min-height:70px;padding:15px 0}.tile{border:1px solid var(--line);border-bottom:3px solid #dfe5d8;border-radius:10px;padding:8px 13px;background:white;font-size:15px}.tile:disabled{visibility:hidden}.answer-tiles{border-block:1px solid var(--line);margin:18px 0;min-height:95px}.answer-tiles .tile:disabled{visibility:visible}.feedback{padding:18px;border-radius:14px;margin-top:22px;font-size:14px;white-space:pre-wrap}.good{color:#407619;background:#eff8e8}.bad{color:#964646;background:#fff0ef}.feedback strong{display:block;margin-bottom:6px}.listen{display:block;font-size:32px;padding:16px 28px;margin:28px auto 15px}.center{text-align:center}.speech-status{min-height:24px;margin:10px 0;font-size:13px;color:var(--muted)}textarea.field{min-height:100px;resize:vertical}.check-input{width:100%;padding:18px;border:1px solid var(--line);border-radius:14px;background:white;font-size:18px}.result{padding:30px 0;text-align:center}.result-icon{font-size:60px;margin:10px}.result-grid{display:flex;gap:12px;justify-content:center;margin:25px 0}.result-grid div{background:var(--soft);border-radius:14px;padding:15px 22px;color:var(--muted);font-size:12px}.result-grid b{display:block;font-size:24px;color:var(--deep)}.settings-group{border-top:1px solid var(--line);margin-top:25px;padding-top:22px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.settings-grid label{display:grid;gap:7px;font-size:13px;color:var(--muted)}.settings-grid input{max-width:100%}details{margin:18px 0}summary{cursor:pointer;color:var(--muted);font-size:13px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#191d17}.video-form{display:flex;gap:10px;margin:24px 0}.video-form input{flex:1;min-width:0}.video-note{margin-top:20px}.video-note label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}.library{display:grid;gap:8px}.library button{text-align:left;overflow-wrap:anywhere}.error-line{color:var(--red);font-size:13px;white-space:pre-wrap}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.file-input{max-width:100%;font-size:12px}#global-status{max-width:980px;margin:auto;padding:0 28px;color:var(--red);font-size:12px}footer{font-size:11px;color:#a1aa99;margin-top:35px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){header{padding:17px 20px 8px}.brand{font-size:28px}.brand span{font-size:9px}.layout{display:block;margin:15px auto;padding:0 20px 110px}nav{position:fixed;bottom:0;left:0;right:0;top:auto;background:rgba(255,255,255,.97);border-top:1px solid var(--line);flex-direction:row;z-index:20;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around}nav button{font-size:11px;flex:1;text-align:center;padding:10px 5px;white-space:nowrap;border-radius:10px}h1{font-size:27px}.panel{padding:21px}.intro{padding:22px}.sprout{font-size:36px}.summary-row{gap:16px;font-size:12px}.steps{margin-left:0}.step{font-size:10px;padding:8px 5px}.rule{font-size:16px}.prompt{font-size:19px;padding:20px}.settings-grid{grid-template-columns:1fr}.lesson-actions{gap:10px}.lesson-actions .button{font-size:12px;padding:12px 15px}.video-form{flex-direction:column}.result-grid div{padding:12px 16px}.filters{flex-direction:column}.filters .field{width:100%}#global-status{padding:0 20px}.option{padding:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
:root[data-theme="dark"]{--text:#e0e8dc;--muted:#a1ac9a;--line:#35402f;--bg:#171e16;--soft:#283922;--deep:#a1d67d;--green:#7dc74c;color-scheme:dark}:root[data-theme="dark"] .panel,:root[data-theme="dark"] .field,:root[data-theme="dark"] .option,:root[data-theme="dark"] .tile,:root[data-theme="dark"] .prompt,:root[data-theme="dark"] .check-input,:root[data-theme="dark"] .secondary,:root[data-theme="dark"] .step{background:#20291d;color:var(--text)}:root[data-theme="dark"] nav{background:#1c241a}:root[data-theme="dark"] .option.selected{background:#203a47;color:#b6e4f8}:root[data-theme="dark"] .bad{background:#442b29;color:#ffbdb5}:root[data-theme="dark"] .good{background:#293f23;color:#b9e6a1}:root[data-theme="dark"] .xp{background:#3b3420;color:#edce80}:root[data-theme="dark"] .intro,:root[data-theme="dark"] .step.done{background:var(--soft)}:root[data-theme="dark"] nav button:hover{background:#2a3426}:root[data-theme="dark"] .meter{background:#36432e}:root[data-theme="dark"] .button:not(.secondary){color:#14240b}
</style></head><body><header><div class="brand">emma<span>english, daily</span></div><div class="xp" id="xp">0 XP</div></header><div id="global-status" role="status" aria-live="polite"></div><div class="layout"><nav aria-label="Навигация"><button data-page="course">◉ Курс</button><button data-page="review">↻ Повторение</button><button data-page="video">▷ Видео</button><button data-page="settings">⚙ Настройки</button></nav><main id="main"></main></div><script>(function(){
'use strict';
if(!window.EmmaNative)return;
let serial=0,voices=[],speakingId=null;const pending=new Map(),instances=new Map(),events=new EventTarget();
const id=()=>String(++serial);
function send(command,data={},requestId=id()){EmmaNative.postMessage(JSON.stringify({command,id:requestId,...data}));return requestId}
window.emmaNativeEvent=function(message){
 if(message.type==='backup-result'){window.dispatchEvent(new CustomEvent('emma-backup',{detail:message}));return}
 if(message.type==='permission'){const resolve=pending.get(message.id);if(resolve){pending.delete(message.id);resolve(message.granted)}return}
 if(message.type==='voices'){voices=message.voices||[];events.dispatchEvent(new Event('voiceschanged'));return}
 if(message.type==='voices-changed'){send('voices');return}
 const instance=instances.get(message.id);if(!instance)return;
 const handlers={'speech-start':'onstart','speech-end':'onend','speech-error':'onerror','recognition-start':'onstart','recognition-error':'onerror','recognition-end':'onend'};
 if(message.type==='recognition-result'){
  const alternative={transcript:message.text,confidence:0};const result=[alternative];result.isFinal=!!message.final;
  instance.onresult?.({results:[result],resultIndex:0});return;
 }
 if(message.type==='speech-end'||message.type==='speech-error'){if(speakingId===message.id)speakingId=null;instances.delete(message.id)}
 if(message.type==='recognition-end'){if(instance._id===message.id)instance._id=null;instances.delete(message.id)}
 instance[handlers[message.type]]?.({error:message.error||'',type:message.type});
};
window.emmaRequestMicrophone=function(){return new Promise(resolve=>{const request=id();pending.set(request,resolve);send('permission',{},request)})};
class NativeUtterance {constructor(text=''){this.text=text;this.lang='en-US';this.rate=1;this.pitch=1;this.volume=1;this.voice=null;}}
window.SpeechSynthesisUtterance=NativeUtterance;
const synthesis={getVoices:()=>voices,addEventListener:(...args)=>events.addEventListener(...args),removeEventListener:(...args)=>events.removeEventListener(...args),cancel(){send('cancel-speech');if(speakingId){instances.delete(speakingId);speakingId=null}},speak(utterance){this.cancel();const request=id();speakingId=request;instances.set(request,utterance);send('speak',{text:utterance.text,lang:utterance.lang,voiceURI:utterance.voice?.voiceURI||'',rate:utterance.rate,pitch:utterance.pitch,volume:utterance.volume},request)}};
Object.defineProperty(window,'speechSynthesis',{value:synthesis,configurable:true});
class NativeRecognition {
 constructor(){this.lang='en-US';this._id=null;}
 start(){if(this._id)throw Error('Recognition already started');this._id=id();instances.set(this._id,this);send('listen',{lang:this.lang},this._id)}
 stop(){if(this._id)send('stop-listen',{},this._id)}
 abort(){if(this._id){const previous=this._id;this._id=null;instances.delete(previous);send('abort-listen',{},previous);this.onend?.()}}
}
window.SpeechRecognition=NativeRecognition;window.webkitSpeechRecognition=NativeRecognition;
send('voices');
})();
</script><script>const COURSE={"modules": [["Первые шаги", "A1"], ["Повседневная жизнь", "A1"], ["О себе и своих занятиях", "A1"], ["Прошлое и планы", "A1"], ["В городе и в поездке", "A2"], ["Опыт и события", "A2"], ["Общение и советы", "A2"], ["Работа и учёба", "A2"], ["Истории и привычки", "B1"], ["Мнения и решения", "B1"], ["Современный мир", "B1"], ["Свободное общение", "B1"]], "units": [{"id": 1, "title": "Приветствия, алфавит, местоимения", "module": 0, "rule": "Чтобы представиться, скажи My name is… или I am… Личные местоимения заменяют имена: I — я, you — ты или вы, she — она. В английском I всегда пишется с большой буквы.", "pattern": "My name is… / I am…", "examples": [["Hello, my name is Emma.", "Привет, меня зовут Эмма.", "name"], ["I am Anna.", "Я Анна.", "am"], ["You are my friend.", "Ты мой друг.", "are"]]}, {"id": 2, "title": "Глагол to be (утверждение)", "module": 0, "rule": "В настоящем времени to be связывает человека с его качеством, профессией или состоянием. После I ставь am, после he/she/it — is, после you/we/they — are. Для профессии в единственном числе обычно нужен a или an.", "pattern": "I am · she is · they are", "examples": [["She is a teacher.", "Она учительница.", "is"], ["He is a doctor.", "Он врач.", "is"], ["We are happy.", "Мы счастливы.", "are"]]}, {"id": 3, "title": "To be: отрицание и вопрос", "module": 0, "rule": "Чтобы отрицать, добавь not после am/is/are. Чтобы задать вопрос, перенеси am/is/are перед подлежащим. Короткий ответ повторяет этот глагол: Yes, I am; No, she isn't.", "pattern": "Are you…? / She is not…", "examples": [["Are you ready?", "Ты готова?", "Are"], ["She is not tired.", "Она не устала.", "not"], ["Is he your brother?", "Он твой брат?", "Is"]]}, {"id": 4, "title": "Артикли a / an / the", "module": 0, "rule": "A/an вводят один предмет, который пока не определён для собеседника. A ставится перед согласным звуком, an — перед гласным. The указывает на конкретный или уже известный предмет. Ориентируйся на звук, а не букву.", "pattern": "a book · an apple · the book", "examples": [["I have an apple.", "У меня есть яблоко.", "an"], ["She has a dog.", "У неё есть собака.", "a"], ["The dog is small.", "Эта собака маленькая.", "The"]]}, {"id": 5, "title": "Множественное число, this / that", "module": 0, "rule": "Обычно множественное число образуется с -s; после некоторых звуков нужно -es. Есть исключения: child → children. This/that относятся к одному предмету, these/those — к нескольким; this/these — ближе, that/those — дальше.", "pattern": "this book → these books", "examples": [["These are my books.", "Это мои книги.", "These"], ["Those houses are old.", "Те дома старые.", "Those"], ["This is my bag.", "Это моя сумка.", "This"]]}, {"id": 6, "title": "Числа, возраст, семья", "module": 0, "rule": "Возраст в английском выражается через to be, а не have. Порядок: человек + am/is/are + число (+ years old). В словах о семье используй my, your, his, her, чтобы назвать, чьи это родственники.", "pattern": "She is twenty years old.", "examples": [["My sister is twenty.", "Моей сестре двадцать лет.", "twenty"], ["My brother is ten.", "Моему брату десять лет.", "ten"], ["I am thirty years old.", "Мне тридцать лет.", "am"]]}, {"id": 7, "title": "Аудирование и повторение", "module": 0, "rule": "При первом прослушивании ищи общую мысль, а не каждое слово. Затем слушай короткими отрывками и сравнивай услышанное с текстом. После like можно использовать форму -ing: like learning — любить учиться.", "pattern": "I like + глагол-ing", "examples": [["I like learning English.", "Мне нравится изучать английский.", "learning"], ["She likes listening to music.", "Ей нравится слушать музыку.", "listening"], ["We like speaking English.", "Нам нравится говорить по-английски.", "speaking"]]}, {"id": 8, "title": "Present Simple: утверждение", "module": 1, "rule": "Present Simple описывает привычки, регулярные действия и факты. С I/you/we/they используй начальную форму глагола. С he/she/it добавляй -s или -es; study превращается в studies.", "pattern": "I work · she works", "examples": [["She works every day.", "Она работает каждый день.", "works"], ["He studies every morning.", "Он занимается каждое утро.", "studies"], ["They live in London.", "Они живут в Лондоне.", "live"]]}, {"id": 9, "title": "Present Simple: отрицание и вопросы", "module": 1, "rule": "В вопросах Present Simple нужны do или does. В отрицании — don't или doesn't. После does/doesn't основной глагол остаётся без -s. Не добавляй do к вопросам с to be.", "pattern": "Does she work? / She does not work.", "examples": [["Do you speak English?", "Ты говоришь по-английски?", "Do"], ["Does he like tea?", "Он любит чай?", "Does"], ["I do not eat meat.", "Я не ем мясо.", "not"]]}, {"id": 10, "title": "Распорядок дня и время", "module": 1, "rule": "Для распорядка дня используй Present Simple. Точное время вводится предлогом at: at seven, at noon. С днями недели ставь on, с месяцами — in. Наречие usually стоит перед смысловым глаголом.", "pattern": "I get up at seven.", "examples": [["I wake up at seven.", "Я просыпаюсь в семь.", "at"], ["She goes to bed at ten.", "Она ложится спать в десять.", "at"], ["We have lunch at noon.", "Мы обедаем в полдень.", "noon"]]}, {"id": 11, "title": "There is / There are", "module": 1, "rule": "There is сообщает о наличии одного предмета или неисчисляемого количества; there are — нескольких предметов. В вопросе порядок меняется: Is there…? / Are there…? Не путай there is с it is, которое описывает уже названный предмет.", "pattern": "There is a… / There are two…", "examples": [["There are two chairs.", "Там два стула.", "are"], ["There is a lamp on the desk.", "На столе есть лампа.", "is"], ["Are there any shops nearby?", "Поблизости есть магазины?", "Are"]]}, {"id": 12, "title": "Предлоги места", "module": 1, "rule": "Предлоги места показывают расположение: in — внутри, on — на поверхности, under — под, next to — рядом. После предлога назови ориентир. Для описания положения предмета обычно нужен to be.", "pattern": "The book is on the table.", "examples": [["The cat is under the table.", "Кот под столом.", "under"], ["My keys are in the bag.", "Мои ключи в сумке.", "in"], ["The bank is next to the cafe.", "Банк рядом с кафе.", "next"]]}, {"id": 13, "title": "Еда и заказ в кафе", "module": 1, "rule": "Для вежливого заказа скажи I would like… вместо резкого I want… С неисчисляемой едой используй some, если не называешь порцию. Для просьбы также подходит Can I have… please?", "pattern": "I would like… / Can I have…?", "examples": [["I would like some tea.", "Я бы хотела немного чая.", "like"], ["Can I have some water please?", "Можно мне немного воды, пожалуйста?", "some"], ["I would like a sandwich.", "Я бы хотела сэндвич.", "would"]]}, {"id": 14, "title": "Аудирование и повторение", "module": 1, "rule": "Слушая рассказ о привычках, отмечай слова every day, usually, at seven. Они помогают понять последовательность событий. Попробуй пересказать услышанное двумя короткими предложениями, сохраняя Present Simple.", "pattern": "I usually + глагол", "examples": [["I usually have breakfast at home.", "Я обычно завтракаю дома.", "usually"], ["He usually walks to work.", "Он обычно ходит на работу пешком.", "usually"], ["They have dinner at six.", "Они ужинают в шесть.", "at"]]}, {"id": 15, "title": "Have got", "module": 2, "rule": "Have got означает «иметь» и часто употребляется в британском английском. С he/she/it используй has got. Вопрос: Have you got…? Отрицание: haven't got или hasn't got. Не смешивай эту схему с do you have.", "pattern": "I have got · she has got", "examples": [["She has got a bike.", "У неё есть велосипед.", "has"], ["Have you got a pen?", "У тебя есть ручка?", "Have"], ["He has not got a car.", "У него нет машины.", "not"]]}, {"id": 16, "title": "Can / can’t", "module": 2, "rule": "Can описывает умение или возможность. После него ставится начальная форма глагола без to; окончание -s не добавляется. Для отрицания используй cannot/can't. В вопросе can ставится перед человеком.", "pattern": "can + глагол без to", "examples": [["I can swim very well.", "Я умею очень хорошо плавать.", "can"], ["Can you help me?", "Ты можешь мне помочь?", "Can"], ["She cannot drive.", "Она не умеет водить.", "cannot"]]}, {"id": 17, "title": "Притяжательные: my, ’s", "module": 2, "rule": "My/your/his/her/our/their ставятся перед существительным и показывают принадлежность. К имени владельца добавляется 's: Anna's book. Не путай his — его и he's — he is. После притяжательного слова артикль не нужен.", "pattern": "my bag · Anna's bag", "examples": [["This is my brother's car.", "Это машина моего брата.", "brother's"], ["Her name is Kate.", "Её зовут Кейт.", "Her"], ["Tom's house is big.", "Дом Тома большой.", "Tom's"]]}, {"id": 18, "title": "Наречия частоты", "module": 2, "rule": "Наречия always, usually, often, sometimes, never показывают частоту. Они обычно стоят перед смысловым глаголом, но после am/is/are. Never уже содержит отрицание: не добавляй к нему don't.", "pattern": "She often reads. / She is always kind.", "examples": [["He never drinks coffee.", "Он никогда не пьёт кофе.", "never"], ["I sometimes cook dinner.", "Я иногда готовлю ужин.", "sometimes"], ["He is always busy.", "Он всегда занят.", "always"]]}, {"id": 19, "title": "Present Continuous", "module": 2, "rule": "Present Continuous описывает действие, происходящее сейчас или в текущий период. Собери am/is/are + глагол-ing. Для отрицания добавь not после to be. В вопросе перенеси am/is/are вперёд.", "pattern": "am / is / are + глагол-ing", "examples": [["They are playing football.", "Они играют в футбол.", "playing"], ["She is reading now.", "Она сейчас читает.", "is"], ["We are learning English.", "Мы изучаем английский.", "learning"]]}, {"id": 20, "title": "Хобби и свободное время", "module": 2, "rule": "Чтобы рассказать о хобби, используй like, love или enjoy с формой -ing. Для спорта возможны разные сочетания: play football, go swimming, do yoga. Выучи сочетание целиком, а не отдельный глагол.", "pattern": "enjoy + глагол-ing", "examples": [["I enjoy reading books.", "Мне нравится читать книги.", "reading"], ["He enjoys cooking.", "Ему нравится готовить.", "cooking"], ["I go swimming on Sundays.", "Я хожу плавать по воскресеньям.", "swimming"]]}, {"id": 21, "title": "Аудирование и повторение", "module": 2, "rule": "В разговоре сначала определи тему по знакомым словам. About означает «о чём-то»: talk about music. Если нужно переспросить, скажи Could you repeat that? Это нормальная часть общения, а не ошибка.", "pattern": "talk about + тема", "examples": [["We are talking about music.", "Мы говорим о музыке.", "talking"], ["They are talking about books.", "Они говорят о книгах.", "about"], ["Could you repeat that please?", "Не могли бы вы это повторить?", "repeat"]]}, {"id": 22, "title": "Past Simple: was / were", "module": 3, "rule": "Was и were — прошедшие формы to be. С I/he/she/it ставь was; с you/we/they — were. В вопросе перенеси их вперёд, для отрицания добавь not. Указатели прошлого: yesterday, last week.", "pattern": "I was · you were", "examples": [["We were at home yesterday.", "Мы были дома вчера.", "were"], ["She was tired yesterday.", "Она вчера устала.", "was"], ["Were they at school?", "Они были в школе?", "Were"]]}, {"id": 23, "title": "Past Simple: правильные глаголы", "module": 3, "rule": "У правильных глаголов Past Simple образуется с -ed. После конечной -e достаточно -d; study → studied. Утвердительное предложение использует одну прошедшую форму для всех лиц. Слова yesterday и last year часто указывают на это время.", "pattern": "work → worked · visit → visited", "examples": [["She visited London last year.", "Она посетила Лондон в прошлом году.", "visited"], ["We watched a film yesterday.", "Вчера мы посмотрели фильм.", "watched"], ["He played tennis last week.", "На прошлой неделе он играл в теннис.", "played"]]}, {"id": 24, "title": "Неправильные глаголы", "module": 3, "rule": "У неправильных глаголов форма Past Simple не образуется по правилу -ed. Учись парами: go → went, see → saw, buy → bought. В утверждении используй прошедшую форму; после did верни начальную.", "pattern": "go → went · see → saw", "examples": [["I went to the park.", "Я пошла в парк.", "went"], ["She bought a new book.", "Она купила новую книгу.", "bought"], ["We saw a beautiful bird.", "Мы увидели красивую птицу.", "saw"]]}, {"id": 25, "title": "Past Simple: вопросы", "module": 3, "rule": "В вопросах и отрицаниях Past Simple используй did/didn't. После них основной глагол возвращается в начальную форму: Did you go? — не went. Для was/were вспомогательный did не нужен.", "pattern": "Did + человек + начальная форма?", "examples": [["Did you see the film?", "Ты посмотрела фильм?", "Did"], ["Did she call you?", "Она тебе звонила?", "Did"], ["I did not see him.", "Я его не видела.", "see"]]}, {"id": 26, "title": "Будущее: going to", "module": 3, "rule": "Going to описывает намерение или прогноз по видимым признакам. Схема: am/is/are + going to + начальная форма глагола. Не пропускай to be: I going to — неполная конструкция.", "pattern": "am / is / are going to + глагол", "examples": [["I am going to study tomorrow.", "Я собираюсь учиться завтра.", "going"], ["She is going to travel.", "Она собирается путешествовать.", "going"], ["We are going to cook dinner.", "Мы собираемся приготовить ужин.", "are"]]}, {"id": 27, "title": "Повторение месяца", "module": 3, "rule": "При повторении сначала найди временной ориентир: every day, now, yesterday, tomorrow. Затем выбери конструкцию, а не отдельное окончание. Полезно рассказать о себе четыре факта: привычка, действие сейчас, прошлое событие и план.", "pattern": "every day · now · yesterday · tomorrow", "examples": [["She can speak two languages.", "Она умеет говорить на двух языках.", "can"], ["I study every day.", "Я занимаюсь каждый день.", "study"], ["Yesterday she was at home.", "Вчера она была дома.", "was"]]}, {"id": 28, "title": "Итоговое повторение", "module": 3, "rule": "Для проверки аудирования сначала ответь, кто говорит, где и о чём. Затем восстанови детали. Learned — правильная прошедшая форма learn; в британском варианте встречается и learnt. Оба варианта допустимы.", "pattern": "learn → learned / learnt", "examples": [["Yesterday I learned something new.", "Вчера я узнала кое-что новое.", "learned"], ["We listened to a short story.", "Мы послушали короткий рассказ.", "listened"], ["I understood the main idea.", "Я поняла главную мысль.", "understood"]]}, {"id": 29, "title": "Покупки: размеры, цены и возврат", "module": 4, "rule": "В магазине try on означает «примерять». С местоимением разделяй фразовый глагол: try it on, а не try on it. Для цены спроси How much is it? Для вежливой просьбы используй Can I…?", "pattern": "Can I try it on?", "examples": [["Can I try this on?", "Можно это примерить?", "try"], ["Do you have a smaller size?", "У вас есть размер поменьше?", "smaller"], ["How much does this cost?", "Сколько это стоит?", "much"]]}, {"id": 30, "title": "Исчисляемые и неисчисляемые существительные", "module": 4, "rule": "Исчисляемые существительные имеют единственное и множественное число: an apple, two apples. Неисчисляемые вроде water, milk, advice обычно не принимают a/an и -s. Для количества называй меру: a glass of water.", "pattern": "an apple · some water", "examples": [["There is some milk left.", "Осталось немного молока.", "some"], ["I need some advice.", "Мне нужен совет.", "some"], ["There are three apples.", "Там три яблока.", "three"]]}, {"id": 31, "title": "Some / any / much / many", "module": 4, "rule": "Much используется с неисчисляемым, many — с исчисляемым множественным числом. Some часто встречается в утверждениях, any — в вопросах и отрицаниях. В предложениях и просьбах возможен some: Would you like some tea?", "pattern": "much water · many books", "examples": [["How much water do you need?", "Сколько воды тебе нужно?", "much"], ["How many books do you have?", "Сколько у тебя книг?", "many"], ["There is not any milk.", "Молока нет.", "any"]]}, {"id": 32, "title": "Сравнительная степень прилагательных", "module": 4, "rule": "Для сравнения коротких прилагательных добавляй -er, перед длинными ставь more. Второй объект вводит than. Есть исключения: good → better, bad → worse. Не соединяй more и -er одновременно.", "pattern": "smaller than · more useful than", "examples": [["This bag is cheaper than that one.", "Эта сумка дешевле той.", "cheaper"], ["My room is bigger than yours.", "Моя комната больше твоей.", "bigger"], ["This task is more difficult.", "Это задание сложнее.", "more"]]}, {"id": 33, "title": "Превосходная степень прилагательных", "module": 4, "rule": "Превосходная степень выделяет один объект среди группы. У коротких прилагательных используется the + -est, у длинных — the most. Исключения: good → the best, bad → the worst. Назови группу, если контекст неясен.", "pattern": "the smallest · the most useful", "examples": [["This is the best day.", "Это лучший день.", "best"], ["She is the tallest student.", "Она самая высокая ученица.", "tallest"], ["This is the most interesting book.", "Это самая интересная книга.", "most"]]}, {"id": 34, "title": "В аэропорту и отеле", "module": 4, "rule": "Для регистрации в отеле полезны have a reservation и check in. В аэропорту нужны passport, boarding pass, gate. Строй короткие просьбы: Could you tell me…? или I would like… Название услуги учи вместе с глаголом.", "pattern": "I have a reservation. / check in", "examples": [["I have a reservation.", "У меня есть бронь.", "reservation"], ["Where is the departure gate?", "Где выход на посадку?", "gate"], ["I would like to check in.", "Я хотела бы зарегистрироваться.", "check"]]}, {"id": 35, "title": "Практикум: путешествие и покупки", "module": 4, "rule": "В дорожном диалоге сначала установи цель: найти место, купить билет или уточнить время. В вопросах where и when указывают, какую информацию нужно услышать. Nearest означает ближайший и обычно употребляется с the.", "pattern": "Where is the nearest…?", "examples": [["Where is the nearest station?", "Где ближайшая станция?", "nearest"], ["What time does the train leave?", "Во сколько отправляется поезд?", "does"], ["I need a ticket to London.", "Мне нужен билет до Лондона.", "ticket"]]}, {"id": 36, "title": "Present Perfect: опыт", "module": 5, "rule": "Present Perfect связывает прошлый опыт с настоящим. Используй have/has + третью форму: visited, seen, been. Если называешь завершённое время вроде yesterday, обычно нужен Past Simple, а не Present Perfect.", "pattern": "have / has + третья форма", "examples": [["I have visited Paris twice.", "Я была в Париже дважды.", "have"], ["She has seen this film.", "Она уже видела этот фильм.", "has"], ["We have been to Italy.", "Мы бывали в Италии.", "been"]]}, {"id": 37, "title": "Present Perfect: already / yet / just", "module": 5, "rule": "Already означает «уже» и обычно стоит между have/has и третьей формой. Just — «только что» — занимает то же место. Yet в вопросах и отрицаниях обычно стоит в конце предложения.", "pattern": "has already finished · not finished yet", "examples": [["She has already finished her work.", "Она уже закончила работу.", "already"], ["I have just arrived.", "Я только что приехала.", "just"], ["Have you finished yet?", "Ты уже закончила?", "yet"]]}, {"id": 38, "title": "Present Perfect и Past Simple", "module": 5, "rule": "Present Perfect подходит для опыта или результата без законченного времени. Past Simple — для события в конкретный завершённый момент. Сравни: I have seen it и I saw it yesterday. Не выбирай время только по русскому переводу.", "pattern": "have seen · saw yesterday", "examples": [["I saw him yesterday.", "Я видела его вчера.", "saw"], ["I have lost my keys.", "Я потеряла ключи.", "have"], ["She visited Rome in May.", "Она посетила Рим в мае.", "visited"]]}, {"id": 39, "title": "Past Continuous: действие в прошлом", "module": 5, "rule": "Past Continuous показывает процесс в определённый момент прошлого. Схема: was/were + глагол-ing. Выбирай was или were по подлежащему. Это взгляд внутрь действия, а не сообщение о его завершении.", "pattern": "was / were + глагол-ing", "examples": [["I was reading at eight.", "Я читала в восемь.", "was"], ["They were sleeping at midnight.", "В полночь они спали.", "were"], ["She was working at nine.", "В девять она работала.", "working"]]}, {"id": 40, "title": "Past Simple и Past Continuous", "module": 5, "rule": "Past Continuous задаёт длительный фон, Past Simple — отдельное событие на этом фоне. Часто when вводит короткое событие, while — процесс. Выбор зависит от смысла, а не только от союза.", "pattern": "I was reading when he called.", "examples": [["I was cooking when he called.", "Я готовила, когда он позвонил.", "when"], ["We were walking when it rained.", "Мы гуляли, когда пошёл дождь.", "walking"], ["She called while I was sleeping.", "Она позвонила, пока я спала.", "while"]]}, {"id": 41, "title": "Путешествия и впечатления", "module": 5, "rule": "Описывая впечатления, различай -ed и -ing: excited — человек испытывает эмоцию, exciting — событие вызывает её. То же правило помогает с bored/boring и interested/interesting.", "pattern": "I was excited. / It was exciting.", "examples": [["The journey was really exciting.", "Путешествие было очень захватывающим.", "exciting"], ["I was excited about the trip.", "Я была взволнована предстоящей поездкой.", "excited"], ["The museum was interesting.", "Музей был интересным.", "interesting"]]}, {"id": 42, "title": "Практикум: рассказ о поездке", "module": 5, "rule": "В вопросах об опыте используй Have you ever…? Ever означает «когда-либо». В ответе можно добавить never — «никогда». Затем переходи к Past Simple, чтобы рассказать о конкретной поездке.", "pattern": "Have you ever + третья форма?", "examples": [["Have you ever travelled alone?", "Ты когда-нибудь путешествовала одна?", "ever"], ["Have you ever eaten sushi?", "Ты когда-нибудь ела суши?", "ever"], ["I have never flown alone.", "Я никогда не летала одна.", "never"]]}, {"id": 43, "title": "Should / shouldn’t: советы", "module": 6, "rule": "Should выражает совет, а не строгую обязанность. После should/shouldn't идёт начальная форма без to. Вопрос строится перестановкой: Should I…? Объясни причину совета через because.", "pattern": "should + начальная форма", "examples": [["You should drink more water.", "Тебе следует пить больше воды.", "should"], ["You should get more sleep.", "Тебе следует больше спать.", "should"], ["You should not worry.", "Тебе не следует волноваться.", "not"]]}, {"id": 44, "title": "Must / have to: обязанности", "module": 6, "rule": "Must и have to выражают необходимость. Важно различать mustn't — «нельзя» и don't have to — «необязательно». В прошлом вместо must для обязанности обычно используется had to.", "pattern": "must · have to · do not have to", "examples": [["I have to leave early.", "Мне нужно уйти рано.", "to"], ["You must wear a seat belt.", "Ты обязана пристегнуть ремень.", "must"], ["We do not have to hurry.", "Нам необязательно спешить.", "not"]]}, {"id": 45, "title": "Просьбы: could / would", "module": 6, "rule": "Could you…? и Would you…? делают просьбу вежливее. После модального глагола используй начальную форму без to. Please можно ставить в конце. Could I…? — просьба о разрешении для себя.", "pattern": "Could you + глагол… please?", "examples": [["Could you help me please?", "Не могли бы вы мне помочь?", "Could"], ["Would you open the window?", "Не могли бы вы открыть окно?", "Would"], ["Could I ask a question?", "Можно задать вопрос?", "Could"]]}, {"id": 46, "title": "Будущее: will и going to", "module": 6, "rule": "Will часто используется для решения в момент речи, обещания или мнения о будущем. Going to — для заранее принятого намерения или прогноза по признакам. Оба варианта могут быть верны при разном контексте.", "pattern": "I will help. / I am going to study.", "examples": [["I think it will rain.", "Думаю, пойдёт дождь.", "will"], ["I will help you tomorrow.", "Я помогу тебе завтра.", "will"], ["She is going to buy a bike.", "Она собирается купить велосипед.", "going"]]}, {"id": 47, "title": "Первое условное: if + will", "module": 6, "rule": "Первое условное описывает реальную возможность в будущем. В части с if ставь Present Simple, в результате — will + глагол. Обычно не ставь will сразу после if. При начальной части с if нужна запятая.", "pattern": "If + Present Simple, will + глагол", "examples": [["If it rains, I will stay home.", "Если пойдёт дождь, я останусь дома.", "If"], ["If you study, you will improve.", "Если ты будешь заниматься, то добьёшься прогресса.", "will"], ["I will call if I am late.", "Я позвоню, если опоздаю.", "if"]]}, {"id": 48, "title": "Здоровье и запись к врачу", "module": 6, "rule": "Чтобы записаться к врачу, используй make an appointment или I'd like to see a doctor. Боль можно описать через have a headache или My back hurts. Не пытайся переводить русские выражения слово в слово.", "pattern": "I have a headache. / My back hurts.", "examples": [["I would like to see a doctor.", "Я хотела бы попасть к врачу.", "doctor"], ["I have a headache.", "У меня болит голова.", "headache"], ["Can I make an appointment?", "Можно записаться на приём?", "appointment"]]}, {"id": 49, "title": "Практикум: советы и договорённости", "module": 6, "rule": "В совете сначала назови проблему, затем действие с should. Take a break — устойчивое сочетание «сделать перерыв». В аудировании отличай совет should от обязанности have to: они передают разную силу рекомендации.", "pattern": "You should take a break.", "examples": [["You should take a break.", "Тебе следует сделать перерыв.", "break"], ["You should rest today.", "Тебе следует сегодня отдохнуть.", "rest"], ["He has to see a doctor.", "Ему необходимо обратиться к врачу.", "has"]]}, {"id": 50, "title": "Работа: профессии и обязанности", "module": 7, "rule": "Для профессии используй work as + роль, а для работодателя — work for + организация. Рабочее место можно назвать через work in/at. Профессия после to be обычно требует a/an: I am a designer.", "pattern": "work as · work for", "examples": [["I work as a designer.", "Я работаю дизайнером.", "as"], ["She works for a small company.", "Она работает в небольшой компании.", "for"], ["He works as an engineer.", "Он работает инженером.", "as"]]}, {"id": 51, "title": "Учёба: цели и расписание", "module": 7, "rule": "Чтобы назвать цель, используй My goal is to… или I want to… После to идёт начальная форма глагола. Для плана подходят going to и конкретное время. Разделяй долгую цель и действие на сегодня.", "pattern": "My goal is to + глагол", "examples": [["My goal is to learn English.", "Моя цель — выучить английский.", "goal"], ["I want to improve my English.", "Я хочу улучшить свой английский.", "improve"], ["She plans to study abroad.", "Она планирует учиться за границей.", "to"]]}, {"id": 52, "title": "Письмо и сообщение на английском", "module": 7, "rule": "Короткое письмо строится из приветствия, причины сообщения, просьбы и завершения. Thank you for требует существительного или -ing: for your help, for helping. После would like используй to + глагол.", "pattern": "Thank you for… / I would like to…", "examples": [["Thank you for your message.", "Спасибо за ваше сообщение.", "for"], ["Thank you for helping me.", "Спасибо за то, что помогли мне.", "helping"], ["I look forward to your reply.", "С нетерпением жду вашего ответа.", "reply"]]}, {"id": 53, "title": "Телефонный разговор", "module": 7, "rule": "По телефону удобно начинать с Hello, this is… Чтобы попросить соединить с человеком, скажи Could I speak to…? Если плохо слышно, попроси повторить: Could you say that again? Говори короткими фразами.", "pattern": "This is Anna speaking.", "examples": [["Could I speak to Anna?", "Могу я поговорить с Анной?", "speak"], ["Hello, this is Anna.", "Здравствуйте, это Анна.", "this"], ["Could you say that again?", "Не могли бы вы повторить?", "again"]]}, {"id": 54, "title": "Герундий и инфинитив: основы", "module": 7, "rule": "После enjoy, avoid, finish обычно используется -ing. После want, decide, plan — to + начальная форма. Это свойство первого глагола, поэтому учи сочетание целиком. Не ставь enjoy to do.", "pattern": "enjoy doing · want to do", "examples": [["I enjoy learning new things.", "Мне нравится узнавать новое.", "learning"], ["She decided to leave.", "Она решила уйти.", "to"], ["We finished cleaning the room.", "Мы закончили убирать комнату.", "cleaning"]]}, {"id": 55, "title": "Повторение A2: грамматика и диалоги", "module": 7, "rule": "При повторении A2 сравни завершённое событие и продолжающуюся ситуацию. Since указывает начало периода, for — его длительность. Present Perfect подходит для ситуации, которая началась раньше и актуальна сейчас.", "pattern": "since May · for two years", "examples": [["We have lived here since May.", "Мы живём здесь с мая.", "since"], ["I have known her for years.", "Я знаю её много лет.", "for"], ["He has worked here since June.", "Он работает здесь с июня.", "since"]]}, {"id": 56, "title": "Итоговый тест A2 и аудирование", "module": 7, "rule": "Пересказывай материал своими словами: The main idea is… Затем добавляй пример и мнение. Explain не требует about перед прямым объектом: explain the answer. Если обращаешься к человеку, скажи explain it to me.", "pattern": "explain something to someone", "examples": [["Let me explain my answer.", "Позвольте мне объяснить мой ответ.", "explain"], ["Please explain it to me.", "Пожалуйста, объясните это мне.", "to"], ["The main idea is simple.", "Главная мысль проста.", "main"]]}, {"id": 57, "title": "Used to: прошлые привычки", "module": 8, "rule": "Used to + начальная форма описывает прошлую привычку или состояние, которых теперь нет. В вопросе и отрицании после did используется use to. Не путай с be used to + -ing — «быть привыкшим».", "pattern": "used to + глагол", "examples": [["I used to live in London.", "Раньше я жила в Лондоне.", "used"], ["She used to play tennis.", "Раньше она играла в теннис.", "used"], ["Did you use to work here?", "Ты раньше здесь работала?", "use"]]}, {"id": 58, "title": "Present Perfect Continuous", "module": 8, "rule": "Present Perfect Continuous подчёркивает процесс, начавшийся в прошлом и связанный с настоящим. Схема have/has been + -ing. For обозначает длительность, since — начало. С глаголами состояния вроде know чаще нужен Present Perfect Simple.", "pattern": "have / has been + глагол-ing", "examples": [["I have been studying for two hours.", "Я занимаюсь уже два часа.", "been"], ["She has been working all day.", "Она работает весь день.", "been"], ["We have been waiting for an hour.", "Мы ждём уже час.", "waiting"]]}, {"id": 59, "title": "Past Perfect: порядок событий", "module": 8, "rule": "Past Perfect обозначает действие, которое произошло раньше другого момента в прошлом. Используй had + третью форму. Сначала установи оба события: к приезду гостя она уже ушла. Не используй Past Perfect без понятной точки отсчёта.", "pattern": "had + третья форма", "examples": [["She had left before I arrived.", "Она ушла до того, как я приехала.", "had"], ["We had eaten before they arrived.", "Мы поели до того, как они приехали.", "had"], ["He had already left when I called.", "Он уже ушёл, когда я позвонила.", "left"]]}, {"id": 60, "title": "Рассказ: when / while / before / after", "module": 8, "rule": "Союзы помогают упорядочить историю: before — до того как, after — после, while — пока. While часто вводит процесс, when — событие. Сначала реши, что случилось раньше и что было фоном; затем выбери время.", "pattern": "while + процесс · when + событие", "examples": [["While I was walking, it started raining.", "Пока я гуляла, начался дождь.", "While"], ["After she arrived, we had dinner.", "После её приезда мы поужинали.", "After"], ["I read while he was cooking.", "Я читала, пока он готовил.", "while"]]}, {"id": 61, "title": "Относительные предложения: who / which / that", "module": 8, "rule": "Who обычно относится к людям, which — к предметам; that может заменять их в определительных предложениях без запятых. Такой оборот помогает уточнить, о каком человеке или предмете идёт речь. Не добавляй повторное местоимение.", "pattern": "the person who… / the book that…", "examples": [["This is the book that I bought.", "Это книга, которую я купила.", "that"], ["The woman who called is my teacher.", "Женщина, которая звонила, — моя учительница.", "who"], ["This is the phone that I lost.", "Это телефон, который я потеряла.", "that"]]}, {"id": 62, "title": "Описание людей и характеров", "module": 8, "rule": "Характер описывают прилагательные kind, patient, reliable. Who помогает объяснить качество через поступки: someone who helps. Для внешности используй look и have; для характера — be. Избегай путаницы look like и be like.", "pattern": "She is kind. / She has blue eyes.", "examples": [["She is someone who always helps.", "Она человек, который всегда помогает.", "who"], ["He is a very patient person.", "Он очень терпеливый человек.", "patient"], ["She has blue eyes.", "У неё голубые глаза.", "has"]]}, {"id": 63, "title": "Практикум: личная история", "module": 8, "rule": "В рассказе отделяй основную цепочку событий от предыстории. Past Simple двигает историю вперёд, Past Continuous создаёт фон, Past Perfect показывает более раннее событие. By the time означает «к тому времени, как».", "pattern": "By the time… had + третья форма", "examples": [["By the time we arrived, it had finished.", "К тому времени, как мы приехали, всё закончилось.", "had"], ["By the time I called, she had left.", "К тому времени, как я позвонила, она ушла.", "had"], ["We were tired because we had walked far.", "Мы устали, потому что прошли большое расстояние.", "because"]]}, {"id": 64, "title": "Второе условное: if + would", "module": 9, "rule": "Второе условное описывает воображаемую или маловероятную ситуацию сейчас или в будущем. Схема if + Past Simple, would + глагол. Прошедшая форма здесь не означает прошлое время. В совете часто говорят If I were you.", "pattern": "If + Past Simple, would + глагол", "examples": [["If I had time, I would travel.", "Если бы у меня было время, я бы путешествовала.", "would"], ["If I were you, I would rest.", "На твоём месте я бы отдохнула.", "were"], ["She would travel if she had money.", "Она бы путешествовала, если бы у неё были деньги.", "would"]]}, {"id": 65, "title": "Первое и второе условное: сравнение", "module": 9, "rule": "Первое условное показывает реальную возможность: if it rains, I will stay. Второе — воображаемый вариант: if I had a car, I would drive. Выбирай по вероятности ситуации с точки зрения говорящего, а не по слову «если».", "pattern": "If I see… will / If I saw… would", "examples": [["If I see her, I will tell her.", "Если я увижу её, я ей скажу.", "will"], ["If she calls, I will answer.", "Если она позвонит, я отвечу.", "will"], ["If I knew, I would tell you.", "Если бы я знала, я бы тебе сказала.", "would"]]}, {"id": 66, "title": "Модальные глаголы предположения", "module": 9, "rule": "Might, may и could выражают возможность; must — уверенный вывод; can't — уверенность, что это невозможно. После них идёт начальная форма без to. Это предположения на основе признаков, а не проверенные факты.", "pattern": "might be · must be · cannot be", "examples": [["He might be at work.", "Возможно, он на работе.", "might"], ["She must be tired.", "Она, должно быть, устала.", "must"], ["That cannot be true.", "Это не может быть правдой.", "cannot"]]}, {"id": 67, "title": "Пассивный залог: настоящее", "module": 9, "rule": "Пассив нужен, когда важнее действие над объектом, чем исполнитель. В Present Simple это am/is/are + третья форма. Объект активного предложения становится подлежащим пассивного. Исполнителя при необходимости вводит by.", "pattern": "is / are + третья форма", "examples": [["English is spoken in many countries.", "На английском говорят во многих странах.", "spoken"], ["These cars are made in Japan.", "Эти машины производят в Японии.", "made"], ["The room is cleaned every day.", "Комнату убирают каждый день.", "is"]]}, {"id": 68, "title": "Пассивный залог: прошлое", "module": 9, "rule": "В прошедшем пассиве используй was/were + третью форму. Выбор was/were зависит от нового подлежащего. Не используй одновременно was и прошедшую форму без причастия: was build неверно, нужно was built.", "pattern": "was / were + третья форма", "examples": [["The bridge was built last year.", "Мост построили в прошлом году.", "built"], ["The letter was sent yesterday.", "Письмо отправили вчера.", "sent"], ["The windows were broken.", "Окна были разбиты.", "were"]]}, {"id": 69, "title": "Выражение мнения и аргументы", "module": 9, "rule": "Чтобы выразить мнение, начни с I think или In my opinion. Затем объясни причину через because и добавь пример. Opinion не является фактом: полезно различать своё отношение и доказательства. Достаточно короткого ясного аргумента.", "pattern": "In my opinion… because…", "examples": [["In my opinion, this is useful.", "По моему мнению, это полезно.", "opinion"], ["I think this plan will work.", "Я думаю, этот план сработает.", "think"], ["In my opinion, exercise is important.", "По моему мнению, физические упражнения важны.", "opinion"]]}, {"id": 70, "title": "Практикум: обсуждение решений", "module": 9, "rule": "При обсуждении решения сначала сформулируй позицию: I agree/disagree. Because вводит причину, however — противопоставление. Выслушай аргумент целиком, прежде чем отвечать. Наличие уверенного тона не заменяет доказательство.", "pattern": "I agree because… / However,…", "examples": [["I agree because the evidence is clear.", "Я согласна, потому что доказательства ясны.", "because"], ["I disagree because it is expensive.", "Я не согласна, потому что это дорого.", "because"], ["However, there is another option.", "Однако есть другой вариант.", "However"]]}, {"id": 71, "title": "Косвенная речь: утверждения", "module": 10, "rule": "При пересказе слов после said часто происходит сдвиг времени назад: am → was, will → would. Меняются местоимения и временные указатели по ситуации. Tell требует адресата: told me; say может использоваться без него.", "pattern": "She said that she was tired.", "examples": [["She said that she was tired.", "Она сказала, что устала.", "was"], ["He said that he was busy.", "Он сказал, что занят.", "was"], ["She told me that she would call.", "Она сказала мне, что позвонит.", "would"]]}, {"id": 72, "title": "Косвенная речь: вопросы", "module": 10, "rule": "В косвенном вопросе используй прямой порядок слов: asked where I lived. Не сохраняй вопросительную инверсию и do/does/did. Для вопросов без вопросительного слова нужны if/whether. Знак вопроса обычно не ставится.", "pattern": "asked where + человек + глагол", "examples": [["He asked where I lived.", "Он спросил, где я живу.", "lived"], ["She asked if I was ready.", "Она спросила, готова ли я.", "if"], ["He asked what I wanted.", "Он спросил, чего я хочу.", "wanted"]]}, {"id": 73, "title": "Фразовые глаголы на каждый день", "module": 10, "rule": "Фразовый глагол состоит из глагола и частицы, вместе они дают новое значение. У разделяемых сочетаний местоимение идёт между частями: turn it off. Некоторые сочетания не разделяются: look after someone. Учи их в коротких фразах.", "pattern": "turn it off · look after someone", "examples": [["Please turn off the lights.", "Пожалуйста, выключи свет.", "off"], ["Please turn it on.", "Пожалуйста, включи это.", "on"], ["I look after my little sister.", "Я присматриваю за младшей сестрой.", "after"]]}, {"id": 74, "title": "Технологии и интернет", "module": 10, "rule": "Для технологий полезны сочетания log in, download a file, stay connected. To + глагол может объяснять цель: I use it to learn. Сочетания помогают говорить точнее, чем перевод каждого русского слова отдельно.", "pattern": "use something to + глагол", "examples": [["I use the internet to stay connected.", "Я пользуюсь интернетом, чтобы оставаться на связи.", "connected"], ["I use this app to learn.", "Я использую это приложение, чтобы учиться.", "to"], ["Please download the file.", "Пожалуйста, скачай файл.", "download"]]}, {"id": 75, "title": "Экология и образ жизни", "module": 10, "rule": "Less ставится перед неисчисляемым количеством, fewer — перед исчисляемым множественным числом. Для советов об экологии используй should и конкретное действие. Reduce, reuse, recycle — уменьшать потребление, использовать повторно, перерабатывать.", "pattern": "less waste · fewer bottles", "examples": [["We should produce less waste.", "Нам следует производить меньше отходов.", "less"], ["We should use fewer plastic bags.", "Нам следует использовать меньше пластиковых пакетов.", "fewer"], ["Recycling helps protect the planet.", "Переработка помогает защищать планету.", "protect"]]}, {"id": 76, "title": "Новости: чтение и пересказ", "module": 10, "rule": "According to вводит источник сообщения: according to the report. Отделяй сказанное источником от собственного мнения. При пересказе сохрани кто, что и когда, а детали добавляй после основной мысли.", "pattern": "According to + источник", "examples": [["According to the report, prices have risen.", "Согласно отчёту, цены выросли.", "According"], ["According to the news, the road is closed.", "Согласно новостям, дорога закрыта.", "According"], ["The report says that sales have grown.", "В отчёте говорится, что продажи выросли.", "have"]]}, {"id": 77, "title": "Практикум: новости и обсуждение", "module": 10, "rule": "Чтобы выделить главную мысль, используй The main point is… Затем объясни её одним примером. Не пересказывай все предложения подряд. Если значение неизвестного слова не влияет на идею, попробуй понять его из контекста.", "pattern": "The main point is…", "examples": [["The main point is easy to understand.", "Главную мысль легко понять.", "point"], ["The speaker gives a clear example.", "Спикер приводит понятный пример.", "example"], ["I understood the main message.", "Я поняла главное сообщение.", "main"]]}, {"id": 78, "title": "Собеседование на английском", "module": 11, "rule": "На собеседовании отвечай через конкретный опыт: I have experience in… Предлог in вводит область, а experience в таком значении обычно неисчисляемое. Короткий пример результата убедительнее общего прилагательного.", "pattern": "have experience in + область", "examples": [["I have experience in this field.", "У меня есть опыт в этой области.", "experience"], ["I have experience in sales.", "У меня есть опыт в продажах.", "in"], ["I worked on a successful project.", "Я работала над успешным проектом.", "worked"]]}, {"id": 79, "title": "Презентация: структура и связки", "module": 11, "rule": "Презентации помогают связки First, Next, Finally. В начале назови цель, затем 2–3 мысли и вывод. Would like to звучит вежливо. Не перегружай одно предложение: короткие фразы легче произнести и понять.", "pattern": "First… Next… Finally…", "examples": [["First, I would like to introduce myself.", "Сначала я хотела бы представиться.", "First"], ["Next, I will explain the results.", "Затем я объясню результаты.", "Next"], ["Finally, let us look at the plan.", "Наконец, давайте посмотрим на план.", "Finally"]]}, {"id": 80, "title": "Вежливое согласие и несогласие", "module": 11, "rule": "Для вежливого несогласия сначала признай мысль: I see your point. Затем добавь but/however и собственную причину. Можно смягчить позицию: I'm not sure I agree. Не путай agree with someone и agree to a proposal.", "pattern": "I see your point, but…", "examples": [["I see your point, but I disagree.", "Я понимаю вашу точку зрения, но не согласна.", "disagree"], ["I am not sure I agree.", "Я не уверена, что согласна.", "agree"], ["I agree with your suggestion.", "Я согласна с вашим предложением.", "with"]]}, {"id": 81, "title": "Решение проблем и жалобы", "module": 11, "rule": "Жалоба понятнее, если назвать проблему, факт и желаемое решение. I would like to make a complaint — вежливое начало. Вместо общих обвинений скажи, что произошло, и попроси refund, replacement или помощь.", "pattern": "I would like a refund.", "examples": [["I would like to make a complaint.", "Я хотела бы подать жалобу.", "complaint"], ["This item does not work.", "Этот товар не работает.", "not"], ["Could I get a replacement?", "Могу я получить замену?", "replacement"]]}, {"id": 82, "title": "Разговор без подготовки", "module": 11, "rule": "В спонтанном разговоре дай себе время: Let me think. Ответ строй из мнения, причины и примера. Для воображаемого решения подходит would. Лучше закончить короткую мысль, чем пытаться сразу построить длинную сложную фразу.", "pattern": "Let me think. / I would…", "examples": [["What would you do in my place?", "Что бы ты сделала на моём месте?", "would"], ["Let me think for a moment.", "Дайте мне немного подумать.", "think"], ["I would ask a friend for advice.", "Я бы попросила совета у друга.", "would"]]}, {"id": 83, "title": "Повторение A1–B1: личный план", "module": 11, "rule": "Повторение эффективнее, если возвращаться к темам, где были ошибки. Выбери одну грамматическую конструкцию и составь с ней три разных фразы. В сравнении confidence — существительное, confident — прилагательное.", "pattern": "feel confident · more confident than", "examples": [["I feel more confident than before.", "Я чувствую себя увереннее, чем раньше.", "confident"], ["Practice helps me feel confident.", "Практика помогает мне чувствовать себя уверенно.", "confident"], ["I want to keep learning.", "Я хочу продолжать учиться.", "learning"]]}, {"id": 84, "title": "Итоговый тест B1 и разговорная практика", "module": 11, "rule": "В итоговом задании соедини навыки: прочитай, прослушай, ответь и перескажи. Оценивай понятность мысли и точность формы отдельно. После курса составь небольшой план повторения, вместо попытки выучить всё за один раз.", "pattern": "Learning takes practice.", "examples": [["Learning a language opens new doors.", "Изучение языка открывает новые возможности.", "opens"], ["Small steps make a difference.", "Маленькие шаги имеют значение.", "make"], ["I can explain my ideas clearly.", "Я могу ясно объяснить свои мысли.", "clearly"]]}]};

const DETAIL_BANK={"1": {"usage": "Начинайте с приветствия Hello/Hi, затем называйте себя: I am… или My name is… Краткая форма I am — I’m.", "spelling": "Местоимение I всегда пишется с заглавной буквы. Имена людей и названия языков тоже: Anna, English.", "exceptions": "You обозначает и «ты», и «вы». Для уважительного обращения отдельной формы нет.", "questions": "Как спросить имя? What is your name? Кратко: What’s your name?"}, "2": {"usage": "Утверждение: подлежащее + am/is/are. Прошедшее время: I/he/she/it was, you/we/they were.", "spelling": "Отрицание: добавьте not после to be. Вопрос: перенесите to be перед подлежащим. Wh-вопрос: Where + are + you?", "exceptions": "Сокращения: I’m, you’re, she’s, isn’t, aren’t, wasn’t, weren’t. Формы amn’t в стандартном учебном английском нет: I’m not.", "questions": "С to be не нужен do/does/did. Правильно: Are you ready? Неправильно: Do you are ready?"}, "3": {"usage": "Утверждение: подлежащее + am/is/are. Прошедшее время: I/he/she/it was, you/we/they were.", "spelling": "Отрицание: добавьте not после to be. Вопрос: перенесите to be перед подлежащим. Wh-вопрос: Where + are + you?", "exceptions": "Сокращения: I’m, you’re, she’s, isn’t, aren’t, wasn’t, weren’t. Формы amn’t в стандартном учебном английском нет: I’m not.", "questions": "С to be не нужен do/does/did. Правильно: Are you ready? Неправильно: Do you are ready?"}, "6": {"usage": "Утверждение: подлежащее + am/is/are. Прошедшее время: I/he/she/it was, you/we/they were.", "spelling": "Отрицание: добавьте not после to be. Вопрос: перенесите to be перед подлежащим. Wh-вопрос: Where + are + you?", "exceptions": "Сокращения: I’m, you’re, she’s, isn’t, aren’t, wasn’t, weren’t. Формы amn’t в стандартном учебном английском нет: I’m not.", "questions": "С to be не нужен do/does/did. Правильно: Are you ready? Неправильно: Do you are ready?"}, "22": {"usage": "Утверждение: подлежащее + am/is/are. Прошедшее время: I/he/she/it was, you/we/they were.", "spelling": "Отрицание: добавьте not после to be. Вопрос: перенесите to be перед подлежащим. Wh-вопрос: Where + are + you?", "exceptions": "Сокращения: I’m, you’re, she’s, isn’t, aren’t, wasn’t, weren’t. Формы amn’t в стандартном учебном английском нет: I’m not.", "questions": "С to be не нужен do/does/did. Правильно: Are you ready? Неправильно: Do you are ready?"}, "4": {"usage": "A/an употребляются только с исчисляемым существительным в единственном числе. The возможно и с множественным числом, и с неисчисляемыми словами.", "spelling": "Выбор a/an зависит от звука: an hour (h не произносится), a university (первый звук /j/), an apple.", "exceptions": "Не ставьте a/an после my/your/this: my book, this book. Для общего смысла во множественном числе артикль часто не нужен: Cats like milk.", "questions": "Сравните: I saw a dog — впервые называю собаку; The dog was black — продолжаю говорить о ней."}, "5": {"usage": "Обычно добавляется -s: book → books. После -s, -sh, -ch, -x обычно -es: bus → buses, box → boxes.", "spelling": "Согласная + y: city → cities; гласная + y: boy → boys. Некоторые -f/-fe меняются на -ves: leaf → leaves, wife → wives.", "exceptions": "Исключения: child → children, person → people, man → men, woman → women, tooth → teeth, foot → feet, mouse → mice. Sheep и deer не меняются.", "questions": "Не все слова на -o получают -es: photos, pianos, но tomatoes, potatoes. This/that + is; these/those + are."}, "8": {"usage": "Утверждение с he/she/it: work → works. Вопрос: Does she work? Отрицание: She doesn’t work. После does окончание -s убирается.", "spelling": "После -s/-sh/-ch/-x/-o обычно -es: watches, washes, goes. Согласная + y: study → studies; гласная + y: play → plays.", "exceptions": "Исключения: have → has, do → does. Глагол be использует собственные формы am/is/are.", "questions": "Вопрос с вопросительным словом: Where does she work? Но вопрос к подлежащему: Who works here? — без does."}, "9": {"usage": "Утверждение с he/she/it: work → works. Вопрос: Does she work? Отрицание: She doesn’t work. После does окончание -s убирается.", "spelling": "После -s/-sh/-ch/-x/-o обычно -es: watches, washes, goes. Согласная + y: study → studies; гласная + y: play → plays.", "exceptions": "Исключения: have → has, do → does. Глагол be использует собственные формы am/is/are.", "questions": "Вопрос с вопросительным словом: Where does she work? Но вопрос к подлежащему: Who works here? — без does."}, "10": {"usage": "At используется с точным временем: at five, at noon, at night. On — с днями и датами: on Monday, on 5 May. In — с месяцами, годами, временем суток: in May, in the morning.", "spelling": "Для места in — внутри/в пределах пространства, on — на поверхности, at — в точке или учреждении в определённом контексте.", "exceptions": "Устойчивые сочетания нужно запоминать: at home, at work, in bed, on the bus, in a car. Смысл и контекст могут менять предлог.", "questions": "Не добавляйте at/on/in перед next/last/this/every в обычных временных выражениях: next Monday, last week, every day."}, "12": {"usage": "At используется с точным временем: at five, at noon, at night. On — с днями и датами: on Monday, on 5 May. In — с месяцами, годами, временем суток: in May, in the morning.", "spelling": "Для места in — внутри/в пределах пространства, on — на поверхности, at — в точке или учреждении в определённом контексте.", "exceptions": "Устойчивые сочетания нужно запоминать: at home, at work, in bed, on the bus, in a car. Смысл и контекст могут менять предлог.", "questions": "Не добавляйте at/on/in перед next/last/this/every в обычных временных выражениях: next Monday, last week, every day."}, "11": {"usage": "Для одного предмета: There is a chair. Для нескольких: There are chairs. С неисчисляемым количеством: There is some water.", "spelling": "Вопрос: Is there…? / Are there…? Отрицание: There isn’t… / There aren’t… Короткий ответ: Yes, there is.", "exceptions": "В разговоре встречается there’s перед перечислением, но в учебном письменном ответе согласуйте число ad to.", "questions": "Might be — возможно; must be — уверенный вывод; can’t be — это невозможно. Эти формы не подтверждают факт сами по себе."}, "45": {"usage": "После can/could/should/must/might используется начальная форма без to. Вопрос образуется переносом модального глагола перед подлежащим.", "spelling": "С he/she/it окончание -s не добавляется: She can swim, не cans. Для отрицания добавьте not. Cannot обычно пишется слитно.", "exceptions": "Mustn’t означает запрет; don’t have to — отсутствие необходимости. Это разные значения. Для прошлого обязательства: had to.", "questions": "Might be — возможно; must be — уверенный вывод; can’t be — это невозможно. Эти формы не подтверждают факт сами по себе."}, "66": {"usage": "После can/could/should/must/might используется начальная форма без to. Вопрос образуется переносом модального глагола перед подлежащим.", "spelling": "С he/she/it окончание -s не добавляется: She can swim, не cans. Для отрицания добавьте not. Cannot обычно пишется слитно.", "exceptions": "Mustn’t означает запрет; don’t have to — отсутствие необходимости. Это разные значения. Для прошлого обязательства: had to.", "questions": "Might be — возможно; must be — уверенный вывод; can’t be — это невозможно. Эти формы не подтверждают факт сами по себе."}, "17": {"usage": "My/your/his/her/its/our/their требуют существительного: my bag. Mine/yours/his/hers/ours/theirs употребляются самостоятельно: The bag is mine.", "spelling": "Владелец в единственном числе: Anna’s book. Обычное множественное на -s: the students’ books. Неправильное множественное: children’s books.", "exceptions": "Its — «его/её» для предмета или животного; it’s — сокращение it is или it has. Апостроф меняет значение.", "questions": "Для предметов возможна конструкция с of: the roof of the house. Притяжательная форма зависит от смысла и естественного сочетания."}, "18": {"usage": "Перед смысловым глаголом: She often reads. После to be: She is often tired. После первого вспомогательного: She has never been there.", "spelling": "Never уже отрицательное по смыслу: I never smoke. Не добавляйте don’t в этой конструкции.", "exceptions": "Sometimes можно поставить и в начале предложения. Always в Present Continuous может выражать раздражение: You are always losing your keys!", "questions": "How often…? спрашивает о частоте; once a week, twice a month — ответы с конкретным количеством."}, "19": {"usage": "Present Continuous: am/is/are + -ing. Past Continuous: was/were + -ing. Отрицание not ставится после be, вопрос начинается с be.", "spelling": "Обычно добавьте -ing: work → working. Конечная немая -e убирается: make → making, но see → seeing.", "exceptions": "Короткая гласная + одна конечная согласная часто дают удвоение: run → running, sit → sitting. Begin → beginning из-за ударения на последнем слоге. W/x/y обычно не удваиваются.", "questions": "Lie → lying, die → dying. Глаголы состояния know, believe, own обычно не употребляются в Continuous в обычном значении."}, "40": {"usage": "Present Continuous: am/is/are + -ing. Past Continuous: was/were + -ing. Отрицание not ставится после be, вопрос начинается с be.", "spelling": "Обычно добавьте -ing: work → working. Конечная немая -e убирается: make → making, но see → seeing.", "exceptions": "Короткая гласная + одна конечная согласная часто дают удвоение: run → running, sit → sitting. Begin → beginning из-за ударения на последнем слоге. W/x/y обычно не удваиваются.", "questions": "Lie → lying, die → dying. Глаголы состояния know, believe, own обычно не употребляются в Continuous в обычном значении."}, "20": {"usage": "После enjoy/avoid/finish ставится -ing; после want/decide/plan — to + начальная форма. Учитe сочетание с первым глаголом.", "spelling": "Like/love допускают -ing и to-infinitive с оттенками смысла. Поэтому не всякий другой вариант после like является ошибкой.", "exceptions": "Stop doing — перестать делать; stop to do — остановить другое действие, чтобы сделать это. Remember doing — помнить прошлое settings=function(){priorSettings();const panel=document.createElement('section');panel.className='settings-group';panel.innerHTML='<h3>Оформление</h3><label class="note" for="theme-choice">Тема</label><select class="field" id="theme-choice"><option value="system">Как на устройстве</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select><details open><summary>Видео — перевод и озвучка</summary><p class="note">Субтитры отображаются отдельно под видео. Перевод загруженного английского текста выполняет MyMemory: есть дневные лимиты, требуется интернет. Текст отправляется этому сервису. Автоматическое извлечение реплик по ссылке не подключено.</p><label class="note" for="video-voice">Русский голос перевода</label><select class="field" id="video-voice"><option value="">Автоматически</option>'+voices().filter(v=>v.lang.startsWith('ru')).map(v=>'<option value="'+h(v.voiceURI)+'">'+h(v.name)+'</option>').join('')+'</select><label class="note" for="video-rate">Темп перевода</label><select class="field" id="video-rate"><option value="0.65">Медленно</option><option value="0.85">Спокойно</option><option value="1">Обычно</option></select><button class="text-button" id="video-preview">▷ Проверить голос перевода</button></details>';$('#main').append(panel);$('#theme-choice').value=state.theme;$('#theme-choice').onchange=e=>{state.theme=e.target.value;save();applyTheme()};$('#video-voice').value=state.videoVoice.uri;$('#video-voice').onchange=e=>{state.videoVoice.uri=e.target.value;save()};$('#video-rate').value=String(state.videoVoice.rate);$('#video-rate').onchange=e=>{state.videoVoice.rate=+e.target.value;save()};$('#video-preview').onclick=()=>speakVideo('Это пример русского перевода видео.')};
function speakVideo(text,done=()=>{}){const previous=state.voice.ruVoiceURI;state.voice.ruVoiceURI=state.videoVoice.uri;try{return speak(text,{lang:'ru-RU',rate:state.videoVoice.rate,done})}finally{state.voice.ruVoiceURI=previous}}
function parseCaptions(text){const cleaned=text.replace(/^\uFEFF/,'').replace(/\r/g,'');const blocks=cleaned.split(/\n\s*\n/),out=[];const time=s=>{const parts=s.trim().replace(',','.').split(':').map(Number);return parts.reduce((a,b)=>a*60+b,0)};for(const block of blocks){const lines=block.split('\n'),i=lines.findIndex(line=>line.includes('-->'));if(i<0)continue;const times=lines[i].match(/((?:\d+:)?\d{2}:\d{2}[.,]\d{3})\s*-->\s*((?:\d+:)?\d{2}:\d{2}[.,]\d{3})/);if(!times)continue;const start=time(times[1]),end=time(times[2]),en=lines.slice(i+1).join(' ').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();if(en&&end>start)out.push({start,end,en,ru:''});if(out.length>=1000)break}return out}
function splitForTranslation(text){const out=[];let chunk='';for(const letter of text){if(new TextEncoder().encode(chunk+letter).length>450){out.push(chunk);chunk=''}chunk+=letter}if(chunk.trim())out.push(chunk);return out}
function captionTime(seconds){const ms=Math.round(seconds*1000),h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,s=Math.floor(ms/1000)%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':')+','+String(ms%1000).padStart(3,'0')}
let translationController=null;
function cancelTranslation(){translationController?.abort();translationController=null}
async function translateCaptions(v){if(translationController)return;const controller=translationController=new AbortController();const update=text=>{if(page==='video'&&$('#translation-status'))$('#translation-status').textContent=text};try{for(let i=0;i<v.cues.length;i++){const cue=v.cues[i];if(cue.ru)continue;let translated=[];for(const part of splitForTranslation(cue.en)){update('Перевод реплики '+(i+1)+' из '+v.cues.length+'…');const url=new URL('https://api.mymemory.translated.net/get');url.searchParams.set('q',part);url.searchParams.set('langpair','en|ru');const response=await fetch(url.href,{signal:controller.signal});if(!response.ok)throw Error('Сервис перевода недоступен. Попробуйте позже.');const result=await response.json();if(result.quotaFinished||Number(result.responseStatus)!==200||!result.responseData?.translatedText)throw Error('Перевод остановлен: лимит или ошибка MyMemory. Готовые реплики сохранены.');translated.push(result.responseData.translatedText.replace(/&quot;/g,'\"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'))}cue.ru=translated.join(' ');save();if(page==='video')renderCaptions(v)}update('Перевод готов. Проверьте формулировки: машинный перевод может ошибаться.')}catch(error){update(error.name==='AbortError'?'Перевод остановлен. Готовые реплики сохранены.':error.message||'Перевод недоступен. Проверьте интернет.')}finally{if(translationController===controller)translationController=null}}
function renderCaptions(v){const root=$('#captions-list');if(!root)return;root.innerHTML=v.cues.map((cue,i)=>'<div class="example"><div class="note">'+h(captionTime(cue.start))+' → '+h(captionTime(cue.end))+'</div><p>'+h(cue.en)+'</p><div class="row between"><span>'+h(cue.ru||'Пока не переведено')+'</span>'+(cue.ru?'<button class="audio-small" data-caption="'+i+'" aria-label="Озвучить перевод реплики '+(i+1)+'">▷</button>':'')+'</div></div>').join('');document.querySelectorAll('[data-caption]').forEach(b=>b.onclick=()=>speakVideo(v.cues[+b.dataset.caption].ru))}
const priorVideo=video;
video=function(){cancelTranslation();priorVideo();const v=state.videos.find(x=>x.url===state.activeVideo)||state.videos[0];if(!v)return;v.cues=v.cues||[];const panel=document.createElement('section');panel.className='panel';panel.innerHTML='<h2>Субтитры и перевод</h2><p class="note">Выберите английские субтитры SRT/VTT — начнётся перевод через MyMemory. Текст будет отправлен сервису. Бесплатный лимит ограничен; длинное видео может не перевестись целиком. По одной ссылке получить субтитры пока нельзя.</p><label class="note" for="captions-file">Загрузить английские субтитры</label><input id="captions-file" class="file-input" type="file" accept=".srt,.vtt,text/plain,text/vtt"><div class="row" style="margin-top:16px"><button class="button secondary" id="translate-captions">Перевести оставшиеся</button><button class="text-button" id="cancel-translation">Стоп перевода</button><button class="text-button" id="speak-captions">▷ Озвучить перевод</button><button class="text-button" id="stop-captions">■ Стоп озвучки</button><button class="text-button" id="download-captions">Сохранить SRT</button></div><p id="translation-status" role="status" class="note"></p><p class="note">Озвучка отдельная: она не синхронизирована с плеером и не приглушает исходное видео. Голос настраивается в «Настройки → Видео».</p><div id="captions-list"></div>';$('#main').append(panel);renderCaptions(v);$('#captions-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{cancelTranslation();if(file.size>500000)throw Error('Файл больше 500 КБ. Разделите его на части.');const cues=parseCaptions(await file.text());if(!cues.length)throw Error('Не найдены реплики с временными метками SRT/VTT.');if(page!=='video')return;v.cues=cues;save();renderCaptions(v);translateCaptions(v)}catch(error){$('#translation-status').textContent=error.message}};$('#translate-captions').onclick=()=>{if(v.cues.length)translateCaptions(v);else $('#translation-status').textContent='Сначала загрузите файл SRT или VTT.'};$('#cancel-translation').onclick=cancelTranslation;$('#stop-captions').onclick=()=>{stopVoice();status('Озвучка остановлена.','#translation-status')};$('#speak-captions').onclick=()=>{const cues=v.cues.filter(c=>c.ru);let i=0;function next(){if(page==='video'&&i<cues.length)speakVideo(cues[i++].ru,next)}if(cues.length)next();else $('#translation-status').textContent='Сначала переведите хотя бы одну реплику.'};$('#download-captions').onclick=()=>{const text=v.cues.filter(c=>c.ru).map((c,i)=>(i+1)+'\n'+captionTime(c.start)+' --> '+captionTime(c.end)+'\n'+c.ru).join('\n\n');if(!text){$('#translation-status').textContent='Нет переведённых реплик для сохранения.';return}if(window.EmmaNative){window.EmmaNative.postMessage(JSON.stringify({command:'export-backup',id:'subtitles',text,filename:'emma-subtitles.srt',mime:'application/x-subrip'}));return}const url=URL.createObjectURL(new Blob([text],{type:'application/x-subrip'})),a=document.createElement('a');a.href=url;a.download='emma-subtitles.srt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}};
const priorSetPage=setPage;setPage=function(next){cancelTranslation();priorSetPage(next);applyTheme()};
window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',()=>applyTheme());

if(validState(state))state=cleanState(state);
$('#xp').textContent=state.xp+' XP';$('#global-status').textContent=storageWarning;
window.addEventListener('emma-backup',event=>{const node=$('#backup-status');if(node)node.textContent=event.detail.ok?'Резервная копия сохранена.':'Файл не сохранён. Можно повторить попытку.'});window.addEventListener('pagehide',stopVoice);if(window.speechSynthesis)window.speechSynthesis.addEventListener('voiceschanged',()=>{if(page==='settings'){fillVoices();const v=$('#video-voice');if(v){v.innerHTML='<option value="">Автоматически</option>'+voices().filter(x=>x.lang.startsWith('ru')).map(x=>'<option value="'+h(x.voiceURI)+'">'+h(x.name)+'</option>').join('');v.value=state.videoVoice.uri}}});setPage('course');
</script></body></html>
